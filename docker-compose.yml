version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "50051:50051"   # gRPC (native)
      - "8080:8080"     # gRPC-Web (built-in wrapper)
    volumes:
      - app-data:/app/data
    environment:
      - DB_PATH=/app/data/control_panel.db
      - JWT_SECRET=super-secret-change-me-in-production
    restart: unless-stopped

  envoy:
    image: envoyproxy/envoy:v1.29-latest
    ports:
      - "8081:8081"     # gRPC-Web via Envoy proxy
      - "9901:9901"     # Envoy admin
    volumes:
      - ./deployments/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app-data:
