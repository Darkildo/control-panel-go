syntax = "proto3";

package controlpanel.v1;

option go_package = "control-panel-go/gen/pb";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service ConfigService {
  rpc CreateConfig (CreateConfigRequest) returns (ConfigResponse);
  rpc GetConfig (GetConfigRequest) returns (ConfigResponse);
  rpc ListConfigs (ListConfigsRequest) returns (ListConfigsResponse);
  rpc UpdateConfig (UpdateConfigRequest) returns (ConfigResponse);
  rpc DeleteConfig (DeleteConfigRequest) returns (google.protobuf.Empty);
  rpc ApplyConfig (ApplyConfigRequest) returns (ApplyConfigResponse);
}

message CreateConfigRequest {
  int64 device_id = 1;
  string version = 2;
  string content = 3;
}

message GetConfigRequest {
  int64 id = 1;
}

message ListConfigsRequest {
  int64 device_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message UpdateConfigRequest {
  int64 id = 1;
  optional string version = 2;
  optional string content = 3;
}

message DeleteConfigRequest {
  int64 id = 1;
}

message ConfigResponse {
  int64 id = 1;
  int64 device_id = 2;
  string version = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
  optional google.protobuf.Timestamp applied_at = 6;
}

message ListConfigsResponse {
  repeated ConfigResponse configs = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ApplyConfigRequest {
  int64 id = 1;
}

message ApplyConfigResponse {
  bool success = 1;
  google.protobuf.Timestamp applied_at = 2;
}
